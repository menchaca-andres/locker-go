{% extends "base.html" %}
{% block title %}Iniciar Sesión | SeriesCalc{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; margin-top: 60px; margin-bottom: 60px;">
    <div class="glass-card" style="padding: 36px 32px; border: 1px solid rgba(99, 102, 241, 0.3); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);">
        
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="brand-icon" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 1.5rem;">∑</div>
            <h1 class="card-title" style="font-size: 1.6rem; margin-bottom: 8px;">Iniciar Sesión</h1>
            <p class="card-desc">Accedé a tus cálculos de series y dashboards analíticos</p>
        </div>

        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.88rem; margin-bottom: 20px;">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="calc-form">
            <div class="form-group">
                <label for="email_o_usuario" class="form-label">Correo electrónico o Usuario</label>
                <input
                    type="text"
                    id="email_o_usuario"
                    name="email_o_usuario"
                    class="form-input"
                    placeholder="ej: usuario@correo.com o usuario"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="••••••••"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px;">
                Ingresar a SeriesCalc →
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--glass-border); font-size: 0.88rem; color: var(--text-3);">
            ¿No tenés una cuenta?
            <a href="/register" style="color: #a5b4fc; font-weight: 600; margin-left: 4px;">Registrate acá</a>
        </div>
    </div>
</div>
{% endblock %}
